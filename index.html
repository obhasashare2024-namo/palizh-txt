const sutras = [{"title": "轉法輪經 (SN 56.11)", "content": "相應部56相應11經/法輪轉起經\n一 有一次，世尊住在波羅奈鹿野苑的仙人墜落處。在那裡，世尊召喚五比丘說：\n「比丘們！出家人不應親近這兩種極端。哪兩種呢？\n其一，沉湎於欲樂之境，這是低劣、粗野、凡夫、不神聖、無益處的；\n其二，專注於自討苦吃，這是痛苦、不神聖、無益處的。\n比丘們！如來不趨向這兩種極端，已現正覺悟中道。這中道能生眼、能生智，導向寂滅、證智、正覺、涅槃。\n二 比丘們！何者是如來所現正覺、能生眼、能生智，導向寂滅、證智、正覺、涅槃的中道呢？\n即此八支聖道：正見、正思惟、正語、正業、正命、正精進、正念、正定。比丘們！這就是如來所現正覺的中道。\n三 比丘們！這是苦聖諦：生是苦，老是苦，病是苦，死是苦，怨憎會是苦，愛別離是苦，求不得是苦；簡略地說，五取蘊就是苦。\n四 比丘們！這是苦集聖諦：就是這導致再生、伴隨喜與貪、到處尋求歡喜的渴愛；即：欲愛、有愛、無有愛。\n五 比丘們！這是苦滅聖諦：就是對那渴愛的無餘離貪、止滅、捨棄、拋棄、解脫、無依住。\n六 比丘們！這是導向苦滅道跡聖諦：即此八支聖道：正見、正思惟、正語、正業、正命、正精進、正念、正定。\n七 『這是苦聖諦』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n『這苦聖諦應該被遍知』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n『這苦聖諦已被遍知』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n八 『這是苦集聖諦』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n『這苦集聖諦應該被捨斷』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n『這苦集聖諦已被捨斷』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n九 『這是苦滅聖諦』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n『這苦滅聖諦應該被作證』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n『這苦滅聖諦已被作證』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n十 『這是導向苦滅道跡聖諦』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n『這導向苦滅道跡聖諦應該被修習』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n『這導向苦滅道跡聖諦已被修習』：比丘們！對於以前未曾聽聞之法，我眼生起、智生起、慧生起、明生起、光生起。\n十一 比丘們！只要我對這四聖諦的三轉十二行相之如實智見尚未完全清淨，比丘們！我就尚未在包含諸天、魔王、梵天之世間，包含沙門、婆羅門、諸天、人之世代中，宣告現正覺悟了無上正等正覺。\n十二 比丘們！當我對這四聖諦的三轉十二行相之如實智見已經完全清淨時，比丘們！我才在包含諸天、魔王、梵天之世間，包含沙門、婆羅門、諸天、人之世代中，宣告現正覺悟了無上正等正覺。我的智見生起：『我的解脫不可動搖，這是我的最後一生，現在不再有再生！』」\n十三 世尊這麼說。五比丘歡喜受持世尊所說。\n十四 當宣說這開示時，尊者憍陳如生起了離塵、離垢的法眼：「凡任何集起之法，一切皆是滅法。」\n十五 當世尊轉動法輪時，地居天眾高聲稱揚：「世尊在波羅奈鹿野苑的仙人墜落處，轉動了無上的法輪，這是任何沙門、婆羅門、諸天、魔王、梵天，乃至世間任何人都不能逆轉的！」\n聽聞地居天的聲音後，四大王天諸天、三十三天諸天、夜摩天諸天、兜率天諸天、化樂天諸天、他化自在天諸天、梵身天諸天，乃至色究竟天諸天皆齊聲高唱稱揚：「世尊在波羅奈鹿野苑的仙人墜落處，轉動了無上的法輪，世間任何人都不能逆轉！」\n十六 就在那一剎那、那一須臾，此妙音遠震直至梵天界；這萬千世界劇烈震動、搖撼、動盪，世間顯現廣大無量、超越諸天神威的光明！\n十七 那時，世尊發出了歡喜的讚歎：「憍陳如確實覺悟了！憍陳如確實覺悟了！」\n因此，尊者憍陳如有了「阿若憍陳如」的名字。"}, {"title": "大念處經 (DN 22)", "content": "長部22經 \n 大品［第二］ \n \n 念住大經 \n \n 我聽到這樣： \n 有一次，世尊住在俱盧國，名叫葛馬沙達馬的俱盧國城鎮。 \n 在那裡，世尊召喚比丘們：「比丘們！」 \n 「尊師！」那些比丘回答世尊。 \n 世尊這麼說： \n 總說 \n 「比丘們！這是為了眾生的清淨、為了愁與悲的超越、為了苦與憂的滅沒、為了方法的獲得、為了涅槃的作證之無岔路之道，即：四念住，哪四個呢？比丘們！這裡，比丘住於在身上隨觀身，熱心、正知、有念，能調伏對於世間的貪與憂；住於在受上隨觀受，熱心、正知、有念，能調伏對於世間的貪與憂；住於在心上隨觀心，熱心、正知、有念，能調伏對於世間的貪與憂；住於在法上隨觀法，熱心、正知、有念，能調伏對於世間的貪與憂。 \n 隨觀身‧入出息節 \n 比丘們！比丘怎樣住於在身上隨觀身呢？比丘們！這裡，比丘到林野，或到樹下，或到空屋，坐下，盤腿後，挺直身體，建立起面前的正念後，他只正念地吸氣、只正念地呼氣：當吸氣長時，他了知：『我吸氣長。』或當呼氣長時，他了知：『我呼氣長。』當吸氣短時，他了知：『我吸氣短。』或當呼氣短時，他了知：『我呼氣短。』他學習：『感受著一切身，我將吸氣。』他學習：『感受著一切身，我將呼氣。』他學習：『使身行寧靜著，我將吸氣。』他學習：『使身行寧靜著，我將呼氣。』比丘們！猶如熟練的絞車工或絞車工的徒弟，當拉長的時，他了知：『我拉長的。』當拉短的時，他了知：『我拉短的。』同樣的，比丘們！比丘當吸氣長時，他了知：『我吸氣長。』或當呼氣長時，他了知：『我呼氣長。』當吸氣短時，他了知：『我吸氣短。』或當呼氣短時，他了知：『我呼氣短。』他學習：『感受著一切身，我將吸氣。』他學習：『感受著一切身，我將呼氣。』他學習：『使身行寧靜著，我將吸氣。』他學習：『使身行寧靜著，我將呼氣。』像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 隨觀身‧舉止行為節 \n 再者，比丘們！比丘當行走時，他了知：『我行走。』或者，當站立時，他了知：『我站立。』或者，當坐著時，他了知：『我坐著。』或者，當躺著時，他了知：『我躺著。』或者，他如身體的動向而了知。像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 隨觀身‧正知節 \n 再者，比丘們！比丘在前進、後退時是正知於行為者；在前視、後視時是正知於行為者；在［肢體］曲伸時是正知於行為者；在［穿］衣、持鉢與大衣時是正知於行為者；在飲、食、嚼、嚐時是正知於行為者；在大小便動作時是正知於行為者；在行、住、坐、臥、清醒、語、默時是正知於行為者。像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 隨觀身‧厭拒作意節 \n 再者，比丘們！比丘觀察此身從腳掌底往上，髮梢往下，皮膚所包覆充滿種種不淨的：『此身有頭髮、體毛、指甲、牙齒、皮膚、肌肉、筋腱、骨骼、骨髓、腎臟、心臟、肝臟、肋膜、脾臟、肺臟、腸子、腸間膜、胃、糞便、膽汁、痰、膿、血、汗、脂肪、眼淚、油脂、唾液、鼻涕、關節液、尿。』比丘們！猶如兩邊有［開］口的袋子放置滿滿的種種穀物，即：山米、紅米、綠豆，豌豆，胡麻，白米，有眼的男子倒出它後能觀察：『這些是山米，這些是紅米，這些是綠豆，這些是豌豆，這些是胡麻，這些是白米。』同樣的，比丘們！比丘觀察此身從腳掌底往上，髮梢往下，皮膚所包覆充滿種種不淨的：『此身有頭髮、體毛、指甲、牙齒、皮膚、肌肉、筋腱、骨骼、骨髓、腎臟、心臟、肝臟、肋膜、脾臟、肺臟、腸子、腸間膜、胃、糞便、膽汁、痰、膿、血、汗、脂肪、眼淚、油脂、唾液、鼻涕、關節液、尿。』像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 隨觀身‧四界作意節 \n 再者，比丘們！比丘就此如其住立、如其志向、有界之身觀察：『在這身體中有地界、水界、火界、風界。』比丘們！猶如熟練的屠牛夫或屠牛夫的徒弟，殺牛後，一片一片地分解，然後會坐在大的十字路口。同樣的，比丘們！比丘就此如其住立、如其動向、有界之身觀察：『在這身體中有地界、水界、火界、風界。』像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 隨觀身‧九墓地節 \n 再者，比丘們！猶如比丘如果看見被捨棄在墓地的遺骸：已死一天、已死二天、已死三天，腫脹、青瘀、生膿爛，他就此身聯想：『此身也有這樣的法，將成為這樣，未跨越這樣。』像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 再者，比丘們！猶如比丘如果看見被捨棄在墓地的遺骸：被烏鴉、鷹、禿鷹、蒼鷺、狗、虎、豹、狐狼、各種生出的蟲吞食，他就此身聯想：『此身也有這樣的法，將成為這樣，未跨越這樣。』像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 再者，比丘們！猶如比丘如果看見被捨棄在墓地的遺骸：有血肉、連著筋的骨鎖；無肉、沾血、連著筋的骨鎖；無血肉、連著筋的骨鎖；骨散亂地離散四處：手骨一處，腳骨一處，腳踝骨一處，小腿骨一處，大腿骨一處，腰骨一處，脊椎骨一處，肋骨一處，胸骨一處，臂骨一處，肩骨一處，頸骨一處，顎骨一處，齒骨一處，頭蓋骨一處，他就此身聯想：『此身也有這樣的法，將成為這樣，未跨越這樣。』像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 再者，比丘們！猶如比丘如果看見被捨棄在墓地的遺骸：類似螺貝顏色的白骨；堆積過一年的骨頭；腐爛破碎化為粉末的骨頭，他就此身聯想：『此身也有這樣的法，將成為這樣，未跨越這樣。』像這樣，或住於在自己的身上隨觀身，或住於在外部的身上隨觀身，或住於在自己的與外部的身上隨觀身，或住於在身上隨觀集法，或住於在身上隨觀消散法，或住於在身上隨觀集法與消散法，或只為了智與憶念的程度而『有身體』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在身上隨觀身。 \n 隨觀受 \n 又，比丘們！比丘怎樣住於在受上隨觀受呢？比丘們！這裡，比丘當感受樂受時，他了知：『我感受樂受。』當感受苦受時，他了知：『我感受苦受。』當感受不苦不樂受時，他了知：『我感受不苦不樂受。』當感受肉體的樂受時，他了知：『我感受肉體的樂受。』當感受精神的樂受時，他了知：『我感受精神的樂受。』當感受肉體的苦受時，他了知：『我感受肉體的苦受。』當感受精神的苦受時，他了知：『我感受精神的苦受。』當感受肉體的不苦不樂受時，他了知：『我感受肉體的不苦不樂受。』當感受精神的不苦不樂受時，他了知：『我感受精神的不苦不樂受。』像這樣，或住於在自己的受上隨觀受，或住於在外部的受上隨觀受，或住於在自己的與外部的受上隨觀受，或住於在受上隨觀集法，或住於在受上隨觀消散法，或住於在受上隨觀集法與消散法，或只為了智與憶念的程度而『有受』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在受上隨觀受。 \n 隨觀心 \n 又，比丘們！比丘怎樣住於在心上隨觀心呢？比丘們！這裡，比丘了知『有貪的心』為有貪的心，了知『離貪的心』為離貪的心；了知『有瞋的心』為有瞋的心，了知『離瞋的心』為離瞋的心；了知『有癡的心』為有癡的心，了知『離癡的心』為離癡的心；了知『簡約的心』為簡約的心，了知『散亂的心』為散亂的心；了知『廣大的心』為廣大的心，了知『不廣大的心』為不廣大的心；了知『更上的心』為更上的心，了知『無更上的心』為無更上的心；了知『得定的心』為得定的心，了知『未得定的心』為未得定的心；了知『已解脫的心』為已解脫的心，了知『未解脫的心』為未解脫的心。像這樣，或住於在自己的心上隨觀心，或住於在外部的心上隨觀心，或住於在自己的與外部的心上隨觀心，或住於在心上隨觀集法，或住於在心上隨觀消散法，或住於在心上隨觀集法與消散法，或只為了智與憶念的程度而『有心』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於在心上隨觀心。 \n 隨觀法‧蓋節 \n 又，比丘們！比丘怎樣住於在法上隨觀法呢？比丘們！這裡，比丘對五蓋住於在法上隨觀法。而，比丘們！比丘怎樣對五蓋住於在法上隨觀法呢？比丘們！這裡，比丘當有自己的欲的意欲時，他了知：『我有自己的欲的意欲。』當沒有自己的欲的意欲時，他了知：『我沒有自己的欲的意欲。』他如其未生起欲的意欲之生起而了知，如其已生起欲的意欲之捨斷而了知，如其已捨斷欲的意欲之未來不生起而了知。當有自己的惡意時，他了知：『我有自己的惡意。』當沒有自己的惡意時，他了知：『我沒有自己的惡意。』他如其未生起惡意之生起而了知，如其已生起惡意之捨斷而了知，如其已捨斷惡意之未來不生起而了知。當有自己的惛沈睡眠時，他了知：『我有自己的惛沈睡眠。』當沒有自己的惛沈睡眠時，他了知：『我沒有自己的惛沈睡眠。』他如其未生起惛沈睡眠之生起而了知，如其已生起惛沈睡眠之捨斷而了知，如其已捨斷惛沈睡眠之未來不生起而了知。當有自己的掉舉後悔時，他了知：『我有自己的掉舉後悔。』當沒有自己的掉舉後悔時，他了知：『我沒有自己的掉舉後悔。』他如其未生起掉舉後悔之生起而了知，如其已生起掉舉後悔之捨斷而了知，如其已捨斷掉舉後悔之未來不生起而了知。當有自己的疑惑時，他了知：『我有自己的疑惑。』當沒有自己的疑惑時，他了知：『我沒有自己的疑惑。』他如其未生起疑惑之生起而了知，如其已生起疑惑之捨斷而了知，如其已捨斷疑惑之未來不生起而了知。像這樣，或住於在自己的法上隨觀法，或住於在外部的法上隨觀法，或住於在自己的與外部的法上隨觀法，或住於在法上隨觀集法，或住於在法上隨觀消散法，或住於在法上隨觀集法與消散法，或只為了智與憶念的程度而『有法』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於對五蓋在法上隨觀法。 \n 隨觀法‧蘊節 \n 再者，比丘們！比丘對五取蘊住於在法上隨觀法。而，比丘們！比丘怎樣對五取蘊住於在法上隨觀法呢？這裡，比丘［了知］：『像這樣是色，像這樣是色的集起，像這樣是色的滅沒；像這樣是受，像這樣是受的集起，像這樣是受的滅沒；像這樣是想，像這樣是想的集起，像這樣是想的滅沒；像這樣是行，像這樣是行的集起，像這樣是行的滅沒；像這樣是識，像這樣是識的集起，像這樣是識的滅沒。』像這樣，或住於在自己的法上隨觀法，或住於在外部的法上隨觀法，或住於在自己的與外部的法上隨觀法，或住於在法上隨觀集法，或住於在法上隨觀消散法，或住於在法上隨觀集法與消散法，或只為了智與憶念的程度而『有法』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於對五取蘊在法上隨觀法。 \n 隨觀法‧處節 \n 再者，比丘們！比丘對六內外處住於在法上隨觀法。而，比丘們！比丘怎樣對六內外處住於在法上隨觀法呢？這裡，比丘了知眼，了知色，了知緣於這兩者生起的結縛，如其未生起結縛之生起而了知，如其已生起結縛之捨斷而了知，如其已捨斷結縛之未來不生起而了知；了知耳，了知聲，了知緣於這兩者生起的結縛，如其未生起結縛之生起而了知，如其已生起結縛之捨斷而了知，如其已捨斷結縛之未來不生起而了知；了知鼻，了知氣味，了知緣於這兩者生起的結縛，如其未生起結縛之生起而了知，如其已生起結縛之捨斷而了知，如其已捨斷結縛之未來不生起而了知；了知舌，了知味道，了知緣於這兩者生起的結縛，如其未生起結縛之生起而了知，如其已生起結縛之捨斷而了知，如其已捨斷結縛之未來不生起而了知；了知身，了知所觸，了知緣於這兩者生起的結縛，如其未生起結縛之生起而了知，如其已生起結縛之捨斷而了知，如其已捨斷結縛之未來不生起而了知；了知意，了知法，了知緣於這兩者生起的結縛，如其未生起結縛之生起而了知，如其已生起結縛之捨斷而了知，如其已捨斷結縛之未來不生起而了知。像這樣，或住於在自己的法上隨觀法，或住於在外部的法上隨觀法，或住於在自己的與外部的法上隨觀法，或住於在法上隨觀集法，或住於在法上隨觀消散法，或住於在法上隨觀集法與消散法，或只為了智與憶念的程度而『有法』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於對六內外處在法上隨觀法。 \n 隨觀法‧覺支節 \n 再者，比丘們！比丘對七覺支住於在法上隨觀法。而，比丘們！比丘怎樣對七覺支住於在法上隨觀法呢？這裡，比丘當自己有念覺支時，了知：『我有念覺支。』當自己沒有念覺支時，了知：『我沒有念覺支。』如其未生起念覺支之生起而了知，如其已生起念覺支之圓滿修習而了知；當自己有擇法覺支時，了知：『我有擇法覺支。』當自己沒有擇法覺支時，了知：『我沒有擇法覺支。』如其未生起擇法覺支之生起而了知，如其已生起擇法覺支之圓滿修習而了知；當自己有活力覺支時，了知：『我有活力覺支。』當自己沒有活力覺支時，了知：『我沒有活力覺支。』如其未生起活力覺支之生起而了知，如其已生起活力覺支之圓滿修習而了知；當自己有喜覺支時，了知：『我有喜覺支。』當自己沒有喜覺支時，了知：『我沒有喜覺支。』如其未生起喜覺支之生起而了知，如其已生起喜覺支之圓滿修習而了知；當自己有寧靜覺支時，了知：『我有寧靜覺支。』當自己沒有寧靜覺支時，了知：『我沒有寧靜覺支。』如其未生起寧靜覺支之生起而了知，如其已生起寧靜覺支之圓滿修習而了知；當自己有定覺支時，了知：『我有定覺支。』當自己沒有定覺支時，了知：『我沒有定覺支。』如其未生起定覺支之生起而了知，如其已生起定覺支之圓滿修習而了知；當自己有平靜覺支時，了知：『我有平靜覺支。』當自己沒有平靜覺支時，了知：『我沒有平靜覺支。』如其未生起平靜覺支之生起而了知，如其已生起平靜覺支之圓滿修習而了知。像這樣，或住於在內法上隨觀法，或住於在外法上隨觀法，或住於在內、外法上隨觀法，或住於在法上隨觀集法，或住於在法上隨觀消散法，或住於在法上隨觀集法與消散法，或只為了智與憶念的程度而『有法』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於對七覺支在法上隨觀法。 \n 隨觀法‧諦節 \n 再者，比丘們！比丘對四聖諦住於在法上隨觀法。而，比丘們！比丘怎樣對四聖諦住於在法上隨觀法呢？這裡，比丘如實了知：『這是苦。』如實了知：『這是苦集。』如實了知：『這是苦滅。』如實了知：『這是導向苦滅道跡。』 \n 苦諦的說明 \n 比丘們！什麼是苦聖諦呢？生是苦，老也是苦，死也是苦，愁、悲、苦、憂、絕望也是苦，與不愛的結合是苦，與所愛的別離是苦，所求不得也是苦，總括之，五取蘊是苦。 \n 而，比丘們！什麼是生呢？所有眾生中，關於每一種眾生類的生、出生、入［胎］、生起、再生、諸蘊顯現、得諸處，比丘們！這被稱為生。 \n 而，比丘們！什麼是老？所有眾生中，關於每一種眾生類的老、老衰、齒落、髮白、皮皺、壽命的衰退、諸根的退化，這被稱為老。 \n 而，比丘們！什麼是死？所有眾生中，由於每一種眾生類的過世、滅亡、崩解、消失、死亡、壽終、諸蘊的崩解、屍體的捨棄，命根斷絕，比丘們！這被稱為死。 \n 而，比丘們！什麼是愁？比丘們！凡具備（遭遇）一些不幸、接觸一些苦法者會有愁、悲傷、憂愁、內部的愁、內部的悲哀，比丘們！這被稱為愁。 \n 而，比丘們！什麼是悲？比丘們！凡具備（遭遇）一些不幸、接觸一些苦法者有悲歎、悲泣、悲歎著、悲泣著、悲歎的狀態、悲泣的狀態，比丘們！這被稱為悲。 \n 而，比丘們！什麼是苦？比丘們！凡身體的苦、身體的不合意，身觸所生的苦與不合意感受，比丘們！這被稱為苦。 \n 而，比丘們！什麼是憂？比丘們！凡心的苦、心的不合意，意觸所生的苦與不合意感受，比丘們！這被稱為憂。 \n 而，比丘們！什麼是絕望？比丘們！凡具備（遭遇）某些不幸、接觸某些苦法者的悲傷、絕望、悲傷的狀態、絕望的狀態，比丘們！這被稱為絕望。 \n 而，比丘們！什麼是與不愛的結合是苦？這裡，凡那些是不喜好的、不想要的、不合意的色、聲、氣味、味道、所觸、法，或凡那些是對他樂於無利益、不利、不安樂、不離軛安穩者，與那些一起會合、集合、結合、合一，比丘們！這被稱為與不愛的結合是苦。 \n 而，比丘們！什麼是與所愛的別離是苦？這裡，凡那些是喜好的、想要的、合意的色、聲、氣味、味道、所觸、法，或凡那些是對他樂於利益、有益、安樂、離軛安穩的母親、父親、兄弟、姊妹、朋友、同事、親族、血親者，與那些一起不會合、不集合、不結合、不合一，比丘們！這被稱為與所愛的別離是苦。 \n 而，比丘們！什麼是所求不得是苦？比丘們！生法的眾生生起這樣的欲求：『啊！願我們沒有生法！願我們的生不來！』但這不以欲求而能得到，這是所求不得是苦。比丘們！老法的眾生生起這樣的欲求：『啊！願我們沒有老法！願我們的老不來！』但這不以欲求而能得到，這是所求不得是苦。比丘們！病法的眾生生起這樣的欲求：『啊！願我們沒有病法！願我們的病不來！』但這不以欲求而能得到，這是所求不得是苦。比丘們！死法的眾生生起這樣的欲求：『啊！願我們沒有死法！願我們的死不來！』但這不以欲求而能得到，這是所求不得是苦。比丘們！愁、悲、苦、憂、絕望法的眾生生起這樣的欲求：『啊！願我們沒有愁、悲、苦、憂、絕望法！願我們的愁、悲、苦、憂、絕望不來！』但這不以欲求而能得到，這是所求不得是苦。 \n 而，比丘們！什麼是總括之，五取蘊是苦？即：色取蘊、受取蘊、想取蘊、行取蘊、識取蘊，比丘們！這被稱為總括之，五取蘊是苦。 \n 比丘們！這被稱為苦聖諦。 \n 集諦的說明 \n 而，比丘們！什麼是苦集聖諦？是這導致再生、伴隨歡喜與貪、到處歡喜的渴愛，即：欲的渴愛、有的渴愛、虛無的渴愛。 \n 而，比丘們！這渴愛當生起時，在哪裡生起呢？當安住時，在哪裡安住呢？凡在世間中可愛的、令人滿意的色，這渴愛當生起時，在這裡生起，當安住時，在這裡安住。 \n 而，什麼是在世間中可愛的、令人滿意的色呢？眼是在世間中可愛的、令人 生起活力、發心、勤奮；為了已生起的善法之存續、不消失、增加、擴大、圓滿修習而生欲、努力、生起活力、發心、勤奮，比丘們！這被稱為正精進。 \n 而，比丘們！什麼是正念？比丘們！這裡，比丘住於在身上隨觀身，熱心、正知、有念，能調伏對於世間的貪與憂；住於在受上隨觀受，熱心、正知、有念，能調伏對於世間的貪與憂；住於在心上隨觀心，熱心、正知、有念，能調伏對於世間的貪與憂；住於在法上隨觀法，熱心、正知、有念，能調伏對於世間的貪與憂，比丘們！這被稱為正念。 \n 而，比丘們！什麼是正定？比丘們！這裡，比丘從離欲、離不善法後，進入後住於有尋、有伺，離而生喜、樂的初禪；以尋與伺的平息，自信，一心，進入後住於無尋、無伺，定而生喜、樂的第二禪；以喜的褪去與住於平靜，正念、正知，以身體感受樂，進入後住於這聖弟子宣說：『他是平靜、專注、住於樂者』的第三禪；以樂的捨斷與苦的捨斷，及以之前喜悅與憂的滅沒，進入後住於不苦不樂，由平靜而正念遍淨的第四禪，比丘們！這被稱為正定。 \n 比丘們！這被稱為導向苦滅道跡聖諦。 \n 像這樣，或住於在自己的法上隨觀法，或住於在外部的法上隨觀法，或住於在自己的與外部的法上隨觀法，或住於在法上隨觀集法，或住於在法上隨觀消散法，或住於在法上隨觀集法與消散法，或只為了智與憶念的程度而『有法』的念被現起，並且住於無依止，他在世間中不執取任何事物。比丘們！比丘這樣住於對四聖諦在法上隨觀法。 \n 比丘們！如果任何人在這四念住上這麼修習七年，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。 \n 比丘們！別說六年，比丘們！如果任何人在這四念住上這麼修習六年，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說五年，比丘們！如果任何人在這四念住上這麼修習五年，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說四年，比丘們！如果任何人在這四念住上這麼修習四年，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說三年，比丘們！如果任何人在這四念住上這麼修習三年，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說二年，比丘們！如果任何人在這四念住上這麼修習二年，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說一年，比丘們！如果任何人在這四念住上這麼修習一年，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說七個月，比丘們！如果任何人在這四念住上這麼修習七個月，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說六個月，比丘們！如果任何人在這四念住上這麼修習六個月，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說五個月，比丘們！如果任何人在這四念住上這麼修習五個月，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說四個月，比丘們！如果任何人在這四念住上這麼修習四個月，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說三個月，比丘們！如果任何人在這四念住上這麼修習三個月，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說二個月，比丘們！如果任何人在這四念住上這麼修習二個月，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說一個月，比丘們！如果任何人在這四念住上這麼修習一個月，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說半個月，比丘們！如果任何人在這四念住上這麼修習半個月，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。比丘們！別說半個月，比丘們！如果任何人在這四念住上這麼修習七天，對他來說，二果其中之一果應該可以被預期：當生完全智，或當存在有餘依時，為不還者狀態。 \n 當像這樣說：『比丘們！這是為了眾生的清淨、為了愁與悲的超越、為了苦與憂的滅沒、為了方法的獲得、為了涅槃的作證之無岔路之道，即：四念住。』時，緣於此而說。」 \n 這就是世尊所說，那些悅意的比丘歡喜世尊所說。"}, {"title": "吉祥經 (Sn 2.4)", "content": "四　大吉祥經四　大吉祥經本經乃向諸天說示有關吉祥之教法。本經原出自 Khuddaka-pāṭha P. 2f（小誦經第五經）依吉祥經之名。又在法句經卷下吉祥品、法句譬喻經卷四吉祥品中，與本經諸偈比較甚為一致及類似之偈亦多。\n如是我聞。一時，世尊住舍衛城祇樹給孤獨園。時有一容姿美麗之天神，夜半\n過後，徧照祇樹園各隅。接近世尊之前，敬禮世尊，立於一方。天神以偈白世尊：\n二五八「諸天諸人等思念諸吉祥\n仰望諸福報語我最吉祥」（一）\n二五九「勿近諸愚者本偈可參照成實論卷一。親近諸賢者\n供養應供者是最上吉祥（二）\n二六〇住於適當所積前世福德\n\n自有正誓願是最上吉祥（三）\n二六一多聞與工巧本偈被引用於 J. III; P. 369。調伏與善學\n多說諸善語是最上吉祥（四）\n二六二孝養父與母妻子當攝受\n正業無混濁是最上吉祥（五）\n二六三如法行布施攝受諸親戚\n諸行業無罪是最上吉祥（六）\n二六四不樂諸惡行且自離飲酒\n諸法不放逸是最上吉祥（七）\n二六五敬重與謙讓滿足及感恩\n時時聞妙法是最上吉祥（八）\n二六六忍辱與柔和會見諸沙門\n時時有法談是最上吉祥（九）\n二六七修苦與梵行善觀四聖諦\n\n涅槃之作證是最上吉祥（一〇）\n二六八觸諸世間法諸世間法（loka-dhammā）為利得（lābha）、不利得（alābha）、名聲（yasa）、不名聲（ayasa）、賞讚（pasamsa）、毀譽（ninda）、樂（sukha）、苦（dukkha）之八法。其心不動搖\n安穩離塵憂是最上吉祥（一一）\n二六九如斯諸行已一切處不敗\n人人得福利是最上吉祥」\n大吉祥經竟"}, {"title": "寶經 (Sn 2.1)", "content": "一　寶經一　寶經依註所示：在毘舍離城發生饑饉等災禍時，毘舍離之離車族欲消除此難，特至王舍城招請世尊來毘舍離。世尊赴毘舍離，為除其災禍而說此經。本經亦出於 khuddakapāṭha PP. 3-6（小誦經第六經）。在 Milinda-Pañha P. 150; Visuddhi-magga P. 414; Samanta-pāsādikā P. 159; ptsA. I, P. 367 等之中，作為世尊所說護咒（Paritta）之一乃最初舉出本經之名。又在 manoratha-pūraṇī II. P. 342 中，以本經為保護咒（Ratana-paritta）。故知本經是用為重要的護咒經。又與本經相當之經有 Mahāvastu I; PP. 290-295，兩者類似之偈極多。\n二二二來此雲集諸鬼神本偈可參照 Mahāvastu I, P. 290。無論地上與空中\n諸鬼神眾皆幸福恭敬諦聽我所說（一）\n二二三諸鬼神眾請傾聽本偈可參照 ibid. P. 294。須對人類施慈行\n不分晝夜運供物是故護彼不放逸（二）\n二二四此世他世多財富本偈可參照 ibid. P. 290F。勝諸天界有財寶\n無有等勝如來寶是故我說如來寶\n依此真理有吉祥（三）\n二二五釋迦牟尼證得定以下之三偈，可參照 ibid. P. 291。勝滅離貪甘露法\n此即殊勝為法寶依此真理有吉祥（四）\n\n二二六最勝佛陀淨讚嘆此是世人無間定「無間定」（ānantariya-samādhi）謂之無漏之道定（magga-samādhi）。此定於無間之後無任何障礙，即可得聖果，故云無間定。\n無有等同此定等依此真理有吉祥（五）\n二二七八輩善人皆賞讚「八輩」（aṭṭha puggalā）是八種聖者，即須陀洹向、須陀洹果、斯陀含向、斯陀含果、阿那含向、阿那含果、阿羅漢向、阿羅漢果。四雙 cattāri yugāni 是向與果為一雙，以上須陀洹乃至阿羅漢為四雙。此等僧眾有四雙\n弟子應施善逝者施與彼等有大果\n此即殊勝為僧寶依此真理有吉祥（六）\n二二八持意堅固善精進本偈可參照 Mahāvastu I. P. 293。瞿曇教中無欲者\n彼等應達甘露門已得無負受寂定\n此即殊勝為僧寶依此真理有吉祥（七）\n二二九恰似帝柱依大地本偈可參照 ibid. P. 292。四方之風不能動\n如此不動諸聖者此等諦觀謂善人\n此即殊勝為僧寶依此真理有吉祥（八）\n二三〇甚深慧者善說示本偈可參照 ibid. P. 292f。明暸諸聖諦仁者\n若彼屢屢有放逸彼等不取第八有「第八有」（bhavaṁ aṭṭhamaṁ），雖謂極七反生之最劣者，但今後只生於七次生存世界（有），以為最極時，其後即般涅槃，更不再來。故得見道聖者，不受第八回之有。\n此即殊勝為僧寶依此真理有吉祥（九）\n\n二三一彼等共有見成具本偈是說有關得見道者。本偈被引用於 Kathā-vatthn P. 109; P. 179; P. 185f; P. 193。又可參照 Mahāvastu P. 291f。彼等實能捨三法\n捨去存在諸身見懷疑乃至戒禁取\n更由四惡趣解脫「四惡趣」（cattāro apāyā）是地獄、餓鬼、畜生、阿修羅。且能不犯六重罪「六重罪」（cha abhiṭhānāni）是在殺母、殺父、殺阿羅漢、出佛身血、破和合僧之五逆罪上，再加就他師外學。\n此即殊勝為僧寶依此真理有吉祥（一〇）\n二三二假令彼等以身語本偈可參照 Mahāvastu I, P. 292。更以心意行惡業\n不得隱蔽而懺悔是則可見涅槃句\n此即殊勝為僧寶依此真理有吉祥（一一）\n二三三恰似夏月中初夏本偈可參照 ibid; P. 294。如林叢中花滿開\n為說第一利益法如此勝法至涅槃\n此即殊勝為佛寶依此真理有吉祥（一二）\n二三四伏知伏施知將來能說勝法無上者\n此即殊勝為佛寶依此真理有吉祥（一三）\n二三五舊業已盡新未生本偈可參照 ibid. P. 293。對於未來心離貪\n種子已盡欲不長賢者如燈明寂滅\n\n此即殊勝為僧寶依此真理有吉祥（一四）\n二三六諸鬼神聚集來此無論地上與空中\n如來應為人天敬「作如來」tathāgata 原本作「如來」，在本偈亦可譯為如來，但次二偈係指法與僧，故不譯為如來。全部使共通而譯為如來。以下二句可參照 Mahāvastu I. P. 295。禮佛有情有吉祥（一五）\n二三七諸鬼神聚集來此本偈之後半及次偈之後半被引用於 UdA. P. 153。無論地上與空中\n如來應為人天敬禮法有情有吉祥（一六）\n二三八諸鬼神聚集來此無論地上與空中\n供奉如來及人天禮僧有情有吉祥（一七）\n寶經竟"}, {"title": "慈經 (Sn 1.8)", "content": "八　慈經八　慈經本經亦出於 khuddaka-pāṭha P. 8（小誦經第九經）。依據 Manoratha-pūraṇī II, P. 342、本經一名慈護咒（Metta-paritta）。是故可知本經常用為護咒。本經乃世尊在雪山之麓、為諸天神所惱亂之比丘，作為護咒及業處（禪定觀法之對象）所說之經。\n一四三義巧之人現觀行彼涅槃之寂靜句\n有能耿直且端正善語柔和無過慢（一）\n一四四心中知足且易養生活簡素無雜行\n\n諸根寂靜且聰明不諂檀越無隨貪（二）\n一四五雖受諸識者非難不行一切雜穢行\n但修慈悲安樂法與眾生幸福安穩以下之二句被引用於 Visudahi-magga P. 297。（三）\n一四六任何生物及生類怖動者與定立者\n任何長身大身者中身者與短軀者\n微細者與粗大者（四）\n一四七目見者與不見者住遠者與不遠者\n已生者與住胎者「已生者」（bhuta）指已生更無生之阿羅漢。利樂此等諸有情（五）\n一四八彼此互相勿欺瞞任何處人勿輕賤\n勿作惱害瞋恚想不欲使人受苦辛（六）\n一四九恰似母有獨生子甘為守護捨身命\n修習無量大慈意一切生類如斯對（七）\n一五〇善待世間諸眾生無量慈意應習生\n上下縱橫無障礙既無怨恨亦無敵（八）\n\n一五一行住坐臥如實知住立慈祥正念中\n遠離睡眠獅子臥佛教名謂慈梵住（九）\n一五二具足戒律成正見不從惡見隨煩惱\n調伏諸欲莫貪求從此不再入母胎（一〇）\n大悲經竟"}, {"title": "無我相經 (SN 22.59)", "content": "相應部22相應59經/五比丘經\n我聽到這樣：有一次，世尊住在波羅奈鹿野苑的仙人墮處。\n在這裡，世尊對五比丘說：「比丘們！」\n「大德！」那些比丘回答世尊。\n世尊這麼說：\n「比丘們！色是無我。比丘們！若色是我，則此色不應遭致病苦，亦得於色欲求：『願我的色如是，願我的色不如是。』\n比丘們！正因為色是無我，所以色遭致病苦，亦不得於色欲求：『願我的色如是，願我的色不如是。』\n受是無我。比丘們！若受是我，則此受不應遭致病苦，亦得於受欲求：『願我的受如是，願我的受不如是。』\n比丘們！正因為受是無我，所以受遭致病苦，亦不得於受欲求：『願我的受如是，願我的受不如是。』\n想是無我。比丘們！若想是我，則此想不應遭致病苦，亦得於想欲求：『願我的想如是，願我的想不如是。』\n比丘們！正因為想是無我，所以想遭致病苦，亦不得於想欲求：『願我的想如是，願我的想不如是。』\n行是無我。比丘們！若行是我，則此行不應遭致病苦，亦得於行欲求：『願我的行如是，願我的行不如是。』\n比丘們！正因為行是無我，所以行遭致病苦，亦不得於行欲求：『願我的行如是，願我的行不如是。』\n識是無我。比丘們！若識是我，則此識不應遭致病苦，亦得於識欲求：『願我的識如是，願我的識不如是。』\n比丘們！正因為識是無我，所以識遭致病苦，亦不得於識欲求：『願我的識如是，願我的識不如是。』\n比丘們！你們怎麼想：色是常還是無常呢？」\n「大德！是無常。」\n「若是無常，那是苦還是樂呢？」\n「大德！是苦。」\n「若是無常、苦、變易之法，能視其為『這是我所有的，這是我，這是我的自我』嗎？」\n「大德！不能。」\n「受是常還是無常呢？」\n「大德！是無常。」\n「若是無常，那是苦還是樂呢？」\n「大德！是苦。」\n「若是無常、苦、變易之法，能視其為『這是我所有的，這是我，這是我的自我』嗎？」\n「大德！不能。」\n「想是常還是無常呢？」\n「大德！是無常。」\n「若是無常，那是苦還是樂呢？」\n「大德！是苦。」\n「若是無常、苦、變易之法，能視其為『這是我所有的，這是我，這是我的自我』嗎？」\n「大德！不能。」\n「行是常還是無常呢？」\n「大德！是無常。」\n「若是無常，那是苦還是樂呢？」\n「大德！是苦。」\n「若是無常、苦、變易之法，能視其為『這是我所有的，這是我，這是我的自我』嗎？」\n「大德！不能。」\n「識是常還是無常呢？」\n「大德！是無常。」\n「若是無常，那是苦還是樂呢？」\n「大德！是苦。」\n「若是無常、苦、變易之法，能視其為『這是我所有的，這是我，這是我的自我』嗎？」\n「大德！不能。」\n「比丘們！因此，任何色，無論過去、未來、現在，內或外，粗或細，劣或勝，遠或近，一切色皆應以正慧如實照見：『這不是我所有的，這不是我，這不是我的自我。』\n任何受，無論過去、未來、現在，內或外，粗或細，劣或勝，遠或近，一切受皆應以正慧如實照見：『這不是我所有的，這不是我，這不是我的自我。』\n任何想，無論過去、未來、現在，內或外，粗或細，劣或勝，遠或近，一切想皆應以正慧如實照見：『這不是我所有的，這不是我，這不是我的自我。』\n任何行，無論過去、未來、現在，內或外，粗或細，劣或勝，遠或近，一切行皆應以正慧如實照見：『這不是我所有的，這不是我，這不是我的自我。』\n任何識，無論過去、未來、現在，內或外，粗或細，劣或勝，遠或近，一切識皆應以正慧如實照見：『這不是我所有的，這不是我，這不是我的自我。』\n比丘們！如是照見的多聞聖弟子，於色生厭離，於受生厭離，於想生厭離，於行生厭離，於識生厭離；生厭離故離貪，離貪故得解脫。解脫時生起解脫之智：『生已盡，梵行已立，所作已辦，不受後有。』」\n世尊這麼說。五比丘歡喜、信受世尊的開示。而且當宣說此經時，五比丘以無執取故，心從諸漏中徹底解脫。"}, {"title": "自說經·菩提品 (UD 1.1)", "content": "一一由第一經至第三經 Mahāvagga I, 1, 1-7. PP. 1-2 參照。五分律十五卷，四分律三十一卷，根本說一切有部毘奈耶破僧事五卷，眾許摩訶帝經七卷，佛本行集經三十一卷等參照。\n如是我聞。爾時，世尊初成正覺，住優樓比螺尼連禪河畔菩提樹下。爾時，世\n尊結跏趺坐，繼續坐享七日間解脫樂。七日已，世尊由禪定起，於夜之初分，順觀\n緣起諸法：「此有故彼有，此生故彼生：即緣無明而有行，緣行而有識，緣識而有名\n色，緣名色而有六入，緣六入而有觸，緣觸而有受，緣受而有愛，緣愛而有取，緣\n取而有有，緣有而有生，緣生而有老死、憂、悲、苦、惱、愁悶。如是生起此苦聚。」\n世尊知此已，彼時唱此優陀那〔自說〕：\n\n「實亦有精勤，禪定婆羅門，領悟諸法時，彼知緣起法Sahetudhamma 亦可成為有因之法。，消除諸疑惑。」"}, {"title": "法句經·雙品 (Dhp 1-20)", "content": "相應部1相應1經 \n 諸天相應／有偈篇／祇夜 \n \n 洪水之渡過經 \n \n 我聽到這樣： \n 有一次，世尊住在舍衛城祇樹林給孤獨園。 \n 那時，當夜已深時，容色絕佳的某位天神使整個祇樹林發光後，去見世尊。抵達後，向世尊問訊，接著在一旁站立。在一旁站好後，那位天神對世尊這麼說： \n \n 「親愛的先生！你怎樣渡過洪水呢？」 \n「朋友！我無住立、無用力地渡過洪水。」 \n \n 「親愛的先生！但，你怎樣我無住立、無用力地渡過洪水呢？」 \n 「朋友！當我住立時，那時，我沈沒；朋友！當我用力時，那時，我被飄走，朋友！這樣，我無住立、無用力地渡過洪水。」 \n \n 「經過好久後，終於，我看見了般涅槃的婆羅門： \n 無住立、無用力地，已渡對世間的執著。」 \n \n 這就是那位天神所說，大師認可了。 \n 那時，那位天神［心想］： \n 「大師認可我了。」向世尊問訊，然後作右繞，接著就在那裡消失了。"}];
const stats = [{"id": "dn", "name": "長部 (Dīgha Nikāya)", "count": 34}, {"id": "mn", "name": "中部 (Majjhima Nikāya)", "count": 152}, {"id": "sn", "name": "相應部 (Saṁyutta Nikāya)", "count": 1419}, {"id": "an", "name": "增支部 (Aṅguttara Nikāya)", "count": 1415}, {"id": "snp", "name": "小部·經集 (Sutta Nipāta)", "count": 73}, {"id": "ud", "name": "小部·自說經 (Udāna)", "count": 68}, {"id": "it", "name": "小部·如是語 (Itivuttaka)", "count": 113}, {"id": "ja", "name": "小部·本生經 (Jātaka)", "count": 548}, {"id": "th", "name": "小部·長老偈與譬喻 (Theragāthā/Apadāna)", "count": 1530}, {"id": "mnd", "name": "小部·大義釋 (Mahāniddesa)", "count": 16}, {"id": "mi", "name": "小部·彌蘭王問 (Milindapañha)", "count": 249}, {"id": "pl", "name": "律藏 (Vinaya Piṭaka)", "count": 423}, {"id": "pa", "name": "論藏·發趣論 (Patthāna)", "count": 729}, {"id": "kv", "name": "論藏·論事 (Kathāvatthu)", "count": 219}];

function init() {
  const select = document.getElementById('sutraSelect');
  sutras.forEach((s, idx) => {
    const opt = document.createElement('option');
    opt.value = idx;
    opt.textContent = s.title;
    select.appendChild(opt);
  });
  loadSutra(0);

  const statsList = document.getElementById('statsList');
  stats.forEach(item => {
    const div = document.createElement('div');
    div.className = 'structure-item';
    div.innerHTML = `<span>${item.name}</span><span style="color:var(--accent-color);font-weight:bold;">${item.count} 經正本</span>`;
    statsList.appendChild(div);
  });
}

function loadSutra(idx) {
  const data = sutras[idx];
  document.getElementById('currentTitle').textContent = data.title;
  const paragraphs = data.content.split('\n').filter(p => p.trim().length > 0);
  const bodyHtml = paragraphs.map(p => `<p>${p}</p>`).join('');
  document.getElementById('currentBody').innerHTML = bodyHtml;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  if (tab === 'core') {
    event.target.classList.add('active');
    document.getElementById('coreView').style.display = 'block';
    document.getElementById('catalogView').style.display = 'none';
  } else {
    event.target.classList.add('active');
    document.getElementById('coreView').style.display = 'none';
    document.getElementById('catalogView').style.display = 'block';
  }
}

function toggleTheme() {
  const body = document.body;
  if (body.getAttribute('data-theme') === 'dark') {
    body.removeAttribute('data-theme');
  } else {
    body.setAttribute('data-theme', 'dark');
  }
}

let curFontSize = 18;
function adjustFont(delta) {
  curFontSize = Math.max(14, Math.min(26, curFontSize + delta));
  document.documentElement.style.setProperty('--font-size', curFontSize + 'px');
}

init();
</script>
